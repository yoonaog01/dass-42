<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答｜年齡與憂鬱、焦慮、壓力的關係</title>
<link rel="stylesheet" href="style.css">
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem("theme"); } catch(e) {}
  if (t !== "dark" && t !== "light") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">DASS 年齡研究</a>
      <a class="link" href="index.html">首頁</a>
      <a class="link" href="results.html">研究結果</a>
      <a class="link active" href="ask.html" aria-current="page">問答</a>
      <a class="link" href="about.html">關於研究</a>
      <button type="button" id="themeBtn" aria-pressed="false"></button>
    </div>
  </nav>
<main>
  <h1>問答</h1>
  <p class="page-sub">針對研究資料提問，取得說明</p>
  <section class="card">
    <form id="askForm">
      <label for="askInput" style="display:block;font-weight:600;margin-bottom:8px">請輸入問題</label>
      <input type="text" id="askInput" autocomplete="off" placeholder="例如：哪個年齡層的憂鬱平均最高？"
        style="width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--text);margin-bottom:12px">
      <button type="submit" id="askBtn">送出</button>
    </form>
    <pre id="askOut" aria-live="polite" style="margin:12px 0 0;white-space:pre-wrap;word-break:break-word;font:inherit"></pre>
  </section>

  <section class="card">
    <button type="button" id="pingBtn">測試連線</button>
    <pre id="pingOut" aria-live="polite" style="margin:12px 0 0;white-space:pre-wrap;word-break:break-word"></pre>
  </section>

  <section class="card">
    <button type="button" id="geminiBtn">測試 Gemini</button>
    <pre id="geminiOut" aria-live="polite" style="margin:12px 0 0;white-space:pre-wrap;word-break:break-word"></pre>
  </section>
</main>
<footer class="footer">
  <span>組別：＿＿＿＿（請填入）</span>
  <span>組員：＿＿＿＿、＿＿＿＿、＿＿＿＿（請填入）</span>
</footer>
<script>
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "☀ 淺色模式" : "🌙 黑暗模式";
  themeBtn.setAttribute("aria-pressed", t === "dark");
}
applyTheme(document.documentElement.getAttribute("data-theme"));
themeBtn.addEventListener("click",()=>{
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("theme", t); } catch(e) {}
});

/* 測試連線：POST {"action":"test"} 到後端，並顯示回應 */
const BACKEND_URL = "https://dass-42.snsd-yoonaog.workers.dev/";
const pingBtn = document.getElementById("pingBtn");
const pingOut = document.getElementById("pingOut");
pingBtn.addEventListener("click", async () => {
  pingBtn.disabled = true;
  pingOut.textContent = "連線中…";
  try {
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      // 用 text/plain 送出 JSON 字串，避免瀏覽器先發預檢請求；後端仍會當 JSON 解析
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ action: "test" })
    });
    const text = await res.text();
    pingOut.textContent = (res.ok ? "" : `錯誤（HTTP ${res.status}）\n`) + text;
  } catch (err) {
    pingOut.textContent = "連線失敗：" + err.message;
  } finally {
    pingBtn.disabled = false;
  }
});

/* 測試 Gemini：送出固定問題，顯示後端回傳的文字 */
const geminiBtn = document.getElementById("geminiBtn");
const geminiOut = document.getElementById("geminiOut");
geminiBtn.addEventListener("click", async () => {
  geminiBtn.disabled = true;
  geminiOut.textContent = "等待回覆中…";
  try {
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ action: "ask", question: "請用一句話自我介紹" })
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (res.ok && data && data.ok) {
      geminiOut.textContent = data.text;
    } else {
      geminiOut.textContent = "失敗：" + ((data && data.error) || `HTTP ${res.status}`);
    }
  } catch (err) {
    geminiOut.textContent = "連線失敗：" + err.message;
  } finally {
    geminiBtn.disabled = false;
  }
});

/* 問答：把問題傳給後端的 ask 動作，顯示回答 */
const askForm = document.getElementById("askForm");
const askInput = document.getElementById("askInput");
const askBtn = document.getElementById("askBtn");
const askOut = document.getElementById("askOut");
askForm.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const question = askInput.value.trim();
  if (!question) { askOut.textContent = "請先輸入問題。"; return; }
  askBtn.disabled = true;
  askOut.textContent = "回答中";
  try {
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ action: "ask", question })
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (res.ok && data && data.ok) {
      askOut.textContent = data.text;
    } else {
      askOut.textContent = "失敗：" + ((data && data.error) || `HTTP ${res.status}`);
    }
  } catch (err) {
    askOut.textContent = "連線失敗：" + err.message;
  } finally {
    askBtn.disabled = false;
  }
});
</script>
</body>
</html>
