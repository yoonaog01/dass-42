<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>年齡與憂鬱、焦慮、壓力的關係</title>
<link rel="stylesheet" href="style.css">
<script>
(function(){
  var t = null;
  try { t = localStorage.getItem("theme"); } catch(e) {}
  if (t !== "dark" && t !== "light") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">DASS 年齡研究</a>

      <a class="link" href="about.html">關於研究</a>

    </div>

<main>
  <h1>年齡與憂鬱、焦慮、壓力的關係</h1>
  <p class="lead">本研究使用 DASS 憂鬱焦慮壓力量表的線上問卷資料，比較不同年齡層在憂鬱、焦慮、壓力三個分量表上的平均分數，以及各嚴重度等級的人數分布。</p>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">—</div><div class="cap">總樣本數</div></div>
    <div class="stat"><div class="num" id="statGroups">—</div><div class="cap">年齡層數</div></div>
    <div class="stat"><div class="num" id="statTop">—</div><div class="cap" id="statTopCap">人數最多的年齡層</div></div>
  </div>
  <p class="source" id="status" style="margin:4px 0 0">資料載入中…</p>

  <h2 class="sec">前往各頁</h2>
  <div class="entries">
    <a class="entry" href="results.html"><b>研究結果</b><span>年齡對各分量表的平均數，以及各年齡層嚴重度分布</span></a>

<footer class="footer">
  <span>組別：＿＿＿＿（請填入）</span>
  <span>組員：＿＿＿＿、＿＿＿＿、＿＿＿＿（請填入）</span>
</footer>
<script>
/* 重點數字：從 Google Sheets「年齡層統計」讀取（script 標籤載入，直接開啟檔案也可使用） */
const SHEET_ID = "1KIA4W9_uGpbQuWVfy5foyokzu8hesqOm68vaZ61znXg";
const SHEET_NAME = "年齡層統計";
const statusEl = document.getElementById("status");
window.__sheetHome = function(resp){
  try {
    if (!resp || resp.status !== "ok") throw new Error("試算表回應錯誤，請確認已開放「知道連結的任何人可檢視」");
    const t = resp.table;
    const cell = c => (c && c.v !== null && c.v !== undefined) ? String(c.v) : "";
    const rows = [t.cols.map(c=>c.label || ""), ...t.rows.map(r=>r.c.map(cell))];
    const h = rows.findIndex(r => (r[0] || "").trim() === "年齡層" && r.map(x=>x.trim()).includes("人數"));
    if (h < 0) throw new Error("找不到標題列");
    const iN = rows[h].map(x=>x.trim()).indexOf("人數");
    const data = [];
    for (let i = h + 1; i < rows.length; i++) {
      const first = (rows[i][0] || "").trim();
      if (!first || first.includes("等級人數")) break;
      const n = Number(rows[i][iN]);
      if (!isFinite(n)) throw new Error("人數欄位格式不正確");
      data.push({ g:first, n });
    }
    if (!data.length) throw new Error("沒有讀到年齡層資料");
    const top = data.reduce((a,b)=> b.n > a.n ? b : a);
    document.getElementById("statTotal").textContent = data.reduce((s,d)=>s+d.n,0).toLocaleString("en-US");
    document.getElementById("statGroups").textContent = data.length;
    document.getElementById("statTop").textContent = top.g;
    document.getElementById("statTopCap").textContent = `人數最多的年齡層（n=${top.n.toLocaleString("en-US")}）`;
    statusEl.textContent = `資料來源：Google Sheets「${SHEET_NAME}」`;
  } catch (e) { statusEl.textContent = "重點數字載入失敗：" + e.message; }
};
(function(){
  const sc = document.createElement("script");
  sc.onerror = () => { statusEl.textContent = "重點數字載入失敗：無法連線到 Google Sheets"; };
  sc.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:__sheetHome&sheet=${encodeURIComponent(SHEET_NAME)}`;
  document.head.appendChild(sc);
})();

const themeBtn = document.getElementById("themeBtn");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "☀ 淺色模式" : "🌙 黑暗模式";
  themeBtn.setAttribute("aria-pressed", t === "dark");
}
applyTheme(document.documentElement.getAttribute("data-theme"));
themeBtn.addEventListener("click",()=>{
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("theme", t); } catch(e) {}
});
</script>
</body>
</html>
